name: Dependabot automerge

on:
  pull_request:

permissions: {}

jobs:
  automerge:
    name: Enable automerge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'EskiMojo14/eskimojo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # The "Require CI" ruleset holds the merge until "Basic checks" passes.
      - name: Enable automerge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
