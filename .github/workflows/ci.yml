name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Basic checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Check formatting, lint, CSS, and types
        run: vp run check

      - name: Build application
        run: vp run build

      - name: Restore Chromium cache
        id: chromium-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure Chromium and system dependencies are installed
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Save Chromium cache
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}

      - name: Start preview server for E2E tests
        id: preview
        background: true
        run: vp run preview --port 4173 --strictPort

      - name: Wait for preview server
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 1 --fail --silent --show-error \
            --output /dev/null http://localhost:4173/

      - name: Run node, E2E, browser, type, and Storybook tests
        env:
          E2E_BASE_URL: http://localhost:4173
        run: vp test run

      - name: Upload E2E failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-artifacts
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop preview server
        cancel: preview
