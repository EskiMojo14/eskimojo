allowBuilds:
  esbuild: false
  lightningcss: false
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
minimumReleaseAgeExcludePrune: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  "@material/material-color-utilities@0.4.0": patches/@material__material-color-utilities@0.4.0.patch
  "@storybook/addon-vitest@10.6.3": patches/@storybook__addon-vitest@10.6.3.patch
  mdx-content-mapper@0.0.2: patches/mdx-content-mapper@0.0.2.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-start":
    skills: true
  modern-web-guidance:
    skills: true
skills:
  dirs:
    - .agents/skills
